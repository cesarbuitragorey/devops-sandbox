<svg viewBox="0 0 945 385" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="945" height="385" fill="#ffffff"/>

  <!-- AWS Account outer box -->
  <rect x="10" y="10" width="925" height="365" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="10" y="10" width="60" height="26" fill="#111111"/>
  <text x="40" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">aws</text>
  <text x="78" y="28" fill="#111111" font-size="13">AWS Account</text>

  <!-- Inner rounded region (developers group scope) -->
  <rect x="115" y="35" width="800" height="335" rx="24" fill="none" stroke="#e8871e" stroke-width="2"/>

  <!-- IAM key icon -->
  <g transform="translate(130,55)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#4a7c2f" stroke-width="4"/>
    <rect x="30" y="16" width="26" height="8" fill="#4a7c2f"/>
    <rect x="48" y="24" width="6" height="10" fill="#4a7c2f"/>
    <rect x="38" y="24" width="6" height="10" fill="#4a7c2f"/>
    <text x="20" y="58" font-size="12" text-anchor="middle" fill="#111111">AWS IAM</text>
  </g>

  <!-- Title -->
  <text x="515" y="60" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">Developers Group</text>

  <!-- Group of people icon (developers group) -->
  <g transform="translate(455,75)">
    <circle cx="30" cy="18" r="14" fill="#b7b7b7"/>
    <circle cx="10" cy="26" r="12" fill="#cfcfcf"/>
    <circle cx="50" cy="26" r="12" fill="#cfcfcf"/>
    <path d="M0,62 C0,42 12,32 30,32 C48,32 60,42 60,62 Z" fill="#b7b7b7"/>
    <path d="M-12,66 C-12,50 -4,42 8,42 L8,66 Z" fill="#cfcfcf"/>
    <path d="M72,66 C72,50 64,42 52,42 L52,66 Z" fill="#cfcfcf"/>
  </g>

  <!-- Permissions icon box -->
  <g transform="translate(660,72)">
    <rect x="0" y="0" width="60" height="72" rx="4" fill="none" stroke="#3a7d2c" stroke-width="3"/>
    <line x1="10" y1="10" x2="50" y2="10" stroke="#3a7d2c" stroke-width="3"/>
    <text x="14" y="30" font-size="20" fill="#2e8b2e">&#10003;</text>
    <text x="14" y="50" font-size="20" fill="#2e8b2e">&#10003;</text>
    <text x="14" y="70" font-size="20" fill="#c0392b">&#10005;</text>
    <text x="30" y="98" font-size="12" text-anchor="middle" fill="#111111">Permissions to</text>
    <text x="30" y="112" font-size="12" text-anchor="middle" fill="#111111">full EC2 access</text>
  </g>

  <!-- Arrow from permissions box to group -->
  <line x1="655" y1="108" x2="530" y2="108" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lines from group down to 3 users -->
  <line x1="485" y1="140" x2="485" y2="185" stroke="#111111" stroke-width="2"/>
  <line x1="265" y1="185" x2="705" y2="185" stroke="#111111" stroke-width="2"/>
  <line x1="265" y1="185" x2="265" y2="235" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="185" x2="485" y2="235" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="185" x2="705" y2="235" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User dev.0 -->
  <g transform="translate(240,245)">
    <circle cx="25" cy="16" r="13" fill="#b7b7b7"/>
    <path d="M0,60 C0,38 10,28 25,28 C40,28 50,38 50,60 Z" fill="#b7b7b7"/>
    <text x="25" y="80" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">User dev.0</text>
  </g>

  <!-- User dev.1 -->
  <g transform="translate(460,245)">
    <circle cx="25" cy="16" r="13" fill="#b7b7b7"/>
    <path d="M0,60 C0,38 10,28 25,28 C40,28 50,38 50,60 Z" fill="#b7b7b7"/>
    <text x="25" y="80" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">User dev.1</text>
  </g>

  <!-- User dev.2 -->
  <g transform="translate(680,245)">
    <circle cx="25" cy="16" r="13" fill="#b7b7b7"/>
    <path d="M0,60 C0,38 10,28 25,28 C40,28 50,38 50,60 Z" fill="#b7b7b7"/>
    <text x="25" y="80" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">User dev.2</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
