<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="350" fill="#ffffff"/>

  <!-- Users icon -->
  <g transform="translate(20,20)">
    <circle cx="30" cy="18" r="14" fill="#b7b7b7"/>
    <circle cx="10" cy="26" r="12" fill="#cfcfcf"/>
    <circle cx="50" cy="26" r="12" fill="#cfcfcf"/>
    <path d="M0,62 C0,42 12,32 30,32 C48,32 60,42 60,62 Z" fill="#b7b7b7"/>
    <path d="M-12,66 C-12,50 -4,42 8,42 L8,66 Z" fill="#cfcfcf"/>
    <path d="M72,66 C72,50 64,42 52,42 L52,66 Z" fill="#cfcfcf"/>
  </g>
  <text x="50" y="105" font-size="15" text-anchor="middle" fill="#111111">Users</text>

  <line x1="50" y1="115" x2="50" y2="185" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="155" font-size="13" fill="#111111">HTTP</text>
  <text x="55" y="170" font-size="13" fill="#111111">requests</text>

  <!-- AWS Cloud boundary -->
  <path d="M180,60 Q180,40 200,40 L640,40 Q660,40 660,60 L660,300 Q660,320 640,320 L200,320 Q180,320 180,300 Z" fill="none" stroke="#111111" stroke-width="2"/>
  <g transform="translate(190,45)">
    <ellipse cx="25" cy="12" rx="25" ry="12" fill="#e8871e"/>
    <text x="25" y="16" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">AWS</text>
  </g>

  <line x1="70" y1="200" x2="220" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Gateway icon -->
  <g transform="translate(230,165)">
    <rect x="0" y="0" width="70" height="70" fill="#8c4fbe"/>
    <text x="35" y="45" font-size="24" text-anchor="middle" fill="#ffffff">&#60;/&#62;</text>
  </g>
  <text x="265" y="255" font-size="14" text-anchor="middle" fill="#111111">Amazon</text>
  <text x="265" y="270" font-size="14" text-anchor="middle" fill="#111111">API Gateway</text>

  <line x1="300" y1="200" x2="400" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lambda icon -->
  <g transform="translate(410,165)">
    <rect x="0" y="0" width="70" height="70" fill="#e8871e"/>
    <polygon points="20,55 30,20 40,20 30,40 45,40 25,55" fill="#ffffff"/>
  </g>
  <text x="445" y="255" font-size="14" text-anchor="middle" fill="#111111">Lambda</text>
  <text x="445" y="270" font-size="14" text-anchor="middle" fill="#111111">function</text>

  <line x1="480" y1="200" x2="570" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Python icon -->
  <g transform="translate(555,155)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="none" stroke="#3a3a3a" stroke-width="3"/>
    <circle cx="40" cy="40" r="14" fill="#f2c02e"/>
  </g>
  <text x="592" y="255" font-size="14" text-anchor="middle" fill="#111111">Python</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
