<svg viewBox="0 0 1020 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1020" height="900" fill="#ffffff"/>

  <!-- Internet cloud -->
  <g transform="translate(460,10)">
    <ellipse cx="50" cy="30" rx="55" ry="28" fill="#cfcfcf"/>
    <text x="50" y="36" font-size="24" text-anchor="middle" fill="#ffffff">&#8645;</text>
  </g>
  <line x1="510" y1="70" x2="510" y2="120" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Route53/DNS icon -->
  <g transform="translate(480,120)">
    <circle cx="30" cy="30" r="30" fill="#e8871e"/>
    <text x="30" y="38" font-size="20" text-anchor="middle" fill="#ffffff">&#9729;</text>
  </g>

  <!-- AWS outer boundary -->
  <rect x="20" y="180" width="980" height="700" rx="12" fill="none" stroke="#111111" stroke-width="2"/>
  <g transform="translate(35,190)"><ellipse cx="30" cy="15" rx="30" ry="15" fill="#e8871e"/><text x="30" y="20" font-size="10" text-anchor="middle" fill="#ffffff">AWS</text></g>

  <!-- VPC boundary -->
  <rect x="70" y="230" width="880" height="620" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
  <g transform="translate(85,240)"><ellipse cx="28" cy="14" rx="28" ry="14" fill="#e8871e"/><text x="28" y="19" font-size="9" text-anchor="middle" fill="#ffffff">VPC</text></g>

  <line x1="510" y1="180" x2="510" y2="290" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ALB -->
  <rect x="330" y="290" width="360" height="90" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="510" y="308" font-size="12" text-anchor="middle" fill="#111111">Security Group</text>
  <g transform="translate(485,315)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="510" y="372" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Application LB (internet-facing)</text>

  <!-- paths -->
  <line x1="400" y1="380" x2="220" y2="440" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="405" font-size="12" fill="#111111">/customers</text>
  <line x1="620" y1="380" x2="800" y2="440" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="405" font-size="12" fill="#111111">/orders</text>

  <!-- Public subnets -->
  <rect x="100" y="440" width="380" height="180" fill="#eaf6ea"/>
  <text x="115" y="460" font-size="13" font-weight="bold" fill="#2f6b27">Public subnet</text>
  <rect x="540" y="440" width="380" height="180" fill="#eaf6ea"/>
  <text x="555" y="460" font-size="13" font-weight="bold" fill="#2f6b27">Public subnet</text>

  <!-- Customers web server -->
  <rect x="130" y="475" width="220" height="90" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="240" y="490" font-size="11" text-anchor="middle" fill="#111111">Security Group</text>
  <g transform="translate(215,498)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="240" y="555" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Customers web server :8080</text>

  <!-- Orders web server -->
  <rect x="600" y="475" width="220" height="90" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="710" y="490" font-size="11" text-anchor="middle" fill="#111111">Security Group</text>
  <g transform="translate(685,498)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="710" y="555" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Orders web server :8080</text>

  <!-- arrows down to NLB -->
  <line x1="240" y1="620" x2="450" y2="700" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="665" font-size="11" fill="#111111">TCP :3000</text>
  <line x1="710" y1="620" x2="570" y2="700" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="665" font-size="11" fill="#111111">UDP :7788</text>

  <!-- NLB -->
  <g transform="translate(455,695)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="510" y="755" font-size="13" text-anchor="middle" fill="#111111" font-weight="bold">Network LB (internal)</text>

  <line x1="480" y1="740" x2="240" y2="790" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="775" font-size="11" fill="#111111">TCP</text>
  <line x1="540" y1="740" x2="780" y2="790" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="775" font-size="11" fill="#111111">UDP</text>

  <!-- Backend services -->
  <rect x="130" y="795" width="220" height="70" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <g transform="translate(215,805)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="240" y="858" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Customers service (TCP)</text>

  <rect x="670" y="795" width="220" height="70" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <g transform="translate(755,805)"><rect x="0" y="0" width="50" height="40" rx="4" fill="#e8871e"/></g>
  <text x="780" y="858" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Orders service (UDP)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
