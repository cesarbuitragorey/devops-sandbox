<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- Internet -->
  <g transform="translate(450,15)">
    <ellipse cx="40" cy="20" rx="45" ry="20" fill="#cfcfcf"/>
    <text x="40" y="26" font-size="14" text-anchor="middle" fill="#111111">Internet</text>
  </g>
  <line x1="490" y1="55" x2="490" y2="90" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IGW -->
  <g transform="translate(430,90)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#e8871e"/>
    <text x="60" y="28" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">Internet Gateway</text>
  </g>

  <!-- VPC boundary -->
  <rect x="60" y="170" width="880" height="420" rx="10" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="80" y="195" font-size="18" font-weight="bold" fill="#111111">VPC — 10.0.0.0/16</text>

  <line x1="490" y1="135" x2="490" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Public subnet -->
  <rect x="90" y="215" width="400" height="345" rx="8" fill="#eaf6ea" stroke="#4a9c3f" stroke-width="2"/>
  <text x="110" y="240" font-size="15" font-weight="bold" fill="#2f6b27">Public Subnet — 10.0.1.0/24</text>

  <!-- Public route table -->
  <g transform="translate(110,255)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#ffffff" stroke="#4a9c3f" stroke-width="1.5"/>
    <text x="100" y="22" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Route Table (public)</text>
    <text x="100" y="40" font-size="11" text-anchor="middle" fill="#111111">0.0.0.0/0 -&gt; IGW</text>
  </g>

  <!-- Public EC2 -->
  <g transform="translate(150,340)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#e8871e"/>
    <text x="60" y="35" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">EC2</text>
    <text x="60" y="52" font-size="11" text-anchor="middle" fill="#ffffff">cmtr-...-public</text>
    <text x="60" y="68" font-size="10" text-anchor="middle" fill="#ffffff">nginx + SSM</text>
  </g>
  <text x="210" y="450" font-size="11" text-anchor="middle" fill="#111111">default SG</text>
  <text x="210" y="465" font-size="11" text-anchor="middle" fill="#111111">IP público</text>

  <!-- Public subnet -> IGW arrow -->
  <line x1="490" y1="215" x2="490" y2="200" stroke="#111111" stroke-width="0"/>

  <!-- Private subnet -->
  <rect x="510" y="215" width="400" height="345" rx="8" fill="#fdeeea" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="240" font-size="15" font-weight="bold" fill="#8c2b1a">Private Subnet — 10.0.2.0/24</text>

  <!-- Private route table -->
  <g transform="translate(530,255)">
    <rect x="0" y="0" width="220" height="55" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="110" y="22" font-size="12" text-anchor="middle" fill="#111111" font-weight="bold">Route Table (private)</text>
    <text x="110" y="40" font-size="11" text-anchor="middle" fill="#111111">solo ruta local (sin internet)</text>
  </g>

  <!-- Private EC2 -->
  <g transform="translate(590,340)">
    <rect x="0" y="0" width="120" height="90" rx="6" fill="#c0392b"/>
    <text x="60" y="35" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">EC2</text>
    <text x="60" y="52" font-size="11" text-anchor="middle" fill="#ffffff">cmtr-...-private</text>
    <text x="60" y="68" font-size="10" text-anchor="middle" fill="#ffffff">sin IP pública</text>
  </g>
  <text x="650" y="450" font-size="11" text-anchor="middle" fill="#111111">default SG</text>

  <!-- ping arrow between instances -->
  <line x1="270" y1="385" x2="590" y2="385" stroke="#555555" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="430" y="375" font-size="11" text-anchor="middle" fill="#555555">ping (mismo SG)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
