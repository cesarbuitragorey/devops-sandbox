<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- Region A box -->
  <rect x="30" y="40" width="260" height="200" rx="8" fill="#eaf6ea" stroke="#4a9c3f" stroke-width="2"/>
  <text x="50" y="65" font-size="15" font-weight="bold" fill="#2f6b27">Region A — us-east-1</text>
  <text x="50" y="85" font-size="12" fill="#111111">VPC-A 10.0.0.0/16</text>
  <g transform="translate(50,100)">
    <rect x="0" y="0" width="90" height="35" rx="4" fill="#e8871e"/>
    <text x="45" y="22" font-size="10" text-anchor="middle" fill="#ffffff">EC2 A</text>
  </g>
  <g transform="translate(160,100)">
    <rect x="0" y="0" width="110" height="35" rx="4" fill="#c0392b"/>
    <text x="55" y="22" font-size="10" text-anchor="middle" fill="#ffffff">TGW-A</text>
  </g>
  <text x="50" y="165" font-size="11" fill="#111111">rt-a: 10.1/16 -&gt; pcx</text>
  <text x="50" y="182" font-size="11" fill="#111111">rt-a: 10.2/16 -&gt; TGW-A</text>

  <!-- Region B box -->
  <rect x="710" y="40" width="260" height="200" rx="8" fill="#eaf6ea" stroke="#4a9c3f" stroke-width="2"/>
  <text x="730" y="65" font-size="15" font-weight="bold" fill="#2f6b27">Region B — eu-west-1</text>
  <text x="730" y="85" font-size="12" fill="#111111">VPC-B 10.1.0.0/16</text>
  <g transform="translate(730,100)">
    <rect x="0" y="0" width="90" height="35" rx="4" fill="#e8871e"/>
    <text x="45" y="22" font-size="10" text-anchor="middle" fill="#ffffff">EC2 B</text>
  </g>
  <g transform="translate(840,100)">
    <rect x="0" y="0" width="110" height="35" rx="4" fill="#c0392b"/>
    <text x="55" y="22" font-size="10" text-anchor="middle" fill="#ffffff">TGW-B</text>
  </g>
  <text x="730" y="165" font-size="11" fill="#111111">rt-b: 10.0/16 -&gt; pcx</text>
  <text x="730" y="182" font-size="11" fill="#111111">rt-b: 10.2/16 -&gt; TGW-B</text>

  <!-- Direct VPC Peering A <-> B -->
  <line x1="290" y1="120" x2="710" y2="120" stroke="#2f6b27" stroke-width="3" marker-start="url(#arrowg)" marker-end="url(#arrowg)"/>
  <text x="500" y="105" font-size="13" text-anchor="middle" fill="#2f6b27" font-weight="bold">VPC Peering directo (pcx-a-b)</text>

  <!-- Region C box (bottom center) -->
  <rect x="370" y="340" width="260" height="200" rx="8" fill="#fdeeea" stroke="#c0392b" stroke-width="2"/>
  <text x="390" y="365" font-size="15" font-weight="bold" fill="#8c2b1a">Region C — ap-south-1</text>
  <text x="390" y="385" font-size="12" fill="#111111">VPC-C 10.2.0.0/16</text>
  <g transform="translate(390,400)">
    <rect x="0" y="0" width="90" height="35" rx="4" fill="#e8871e"/>
    <text x="45" y="22" font-size="10" text-anchor="middle" fill="#ffffff">EC2 C</text>
  </g>
  <g transform="translate(500,400)">
    <rect x="0" y="0" width="110" height="35" rx="4" fill="#c0392b"/>
    <text x="55" y="22" font-size="10" text-anchor="middle" fill="#ffffff">TGW-C</text>
  </g>
  <text x="390" y="465" font-size="11" fill="#111111">rt-c: 10.0/16 -&gt; TGW-C</text>
  <text x="390" y="482" font-size="11" fill="#111111">rt-c: 10.1/16 -&gt; TGW-C</text>

  <!-- TGW peering lines -->
  <line x1="215" y1="135" x2="500" y2="400" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,4" marker-start="url(#arrowr)" marker-end="url(#arrowr)"/>
  <text x="300" y="290" font-size="13" fill="#8c2b1a" font-weight="bold" transform="rotate(35 300 290)">TGW Peering C-A</text>

  <line x1="895" y1="135" x2="610" y2="400" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,4" marker-start="url(#arrowr)" marker-end="url(#arrowr)"/>
  <text x="800" y="290" font-size="13" fill="#8c2b1a" font-weight="bold" transform="rotate(-35 800 290)">TGW Peering C-B</text>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6b27"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8c2b1a"/>
    </marker>
  </defs>
</svg>
