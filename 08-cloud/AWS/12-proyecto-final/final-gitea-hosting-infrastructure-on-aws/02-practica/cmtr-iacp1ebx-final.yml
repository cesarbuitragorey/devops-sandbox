AWSTemplateFormatVersion: "2010-09-09"
Description: Gitea hosting infrastructure - VPC, ALB, RDS, EFS, ASG with Docker Compose

Resources:

  # ---------- Networking ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: eu-west-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-pub-sub1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: eu-west-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-pub-sub2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: eu-west-1a
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-priv-sub1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: eu-west-1b
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-priv-sub2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-private-rt1

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-public-rt1

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------- Security Groups ----------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-alb-sg

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from ALB and SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-ec2-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-rds-sg

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-efs-sg

  # ---------- Load Balancer ----------
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cmtr-iacp1ebx-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cmtr-iacp1ebx-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - "/*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- RDS ----------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for giteadb
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  GiteaDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: giteadb
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      MasterUsername: gitea
      MasterUserPassword: gitea_passwd
      DBName: giteadb
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false

  # ---------- EFS ----------
  EFS:
    Type: AWS::EFS::FileSystem
    Properties:
      FileSystemTags:
        - Key: Name
          Value: cmtr-iacp1ebx-efs

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFS
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFS
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # ---------- IAM for EC2 instances ----------
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cmtr-iacp1ebx-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AdministratorAccess

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: cmtr-iacp1ebx-profile
      Roles:
        - !Ref EC2Role

  # ---------- Launch Template / ASG ----------
  GiteaLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn:
      - GiteaDB
      - EFSMountTarget1
      - EFSMountTarget2
      - ALB
    Properties:
      LaunchTemplateName: cmtr-iacp1ebx-lt
      LaunchTemplateData:
        InstanceType: t3.micro
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        IamInstanceProfile:
          Name: !Ref EC2InstanceProfile
        SecurityGroupIds:
          - !Ref EC2SecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            sudo yum update -y
            sudo yum install -y amazon-efs-utils aws-cli docker

            mkdir -p /gitea
            EFS_ID=$(aws efs describe-file-systems --region eu-west-1 --query "FileSystems[?Tags[?Key=='Name' && Value=='cmtr-iacp1ebx-efs']].FileSystemId | [0]" --output text)
            mount -t efs -o tls $EFS_ID:/ /gitea
            echo "$EFS_ID:/ /gitea efs defaults,_netdev 0 0" >> /etc/fstab

            sudo service docker start
            sudo usermod -a -G docker ec2-user
            sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            RDS_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier giteadb --query "DBInstances[*].Endpoint.Address" --output text --region eu-west-1)

            ALB_DNS=$(aws elbv2 describe-load-balancers --names cmtr-iacp1ebx-alb --query "LoadBalancers[0].DNSName" --output text --region eu-west-1)

            echo "version: '3.9'
            services:
              gitea:
                image: gitea/gitea:latest
                environment:
                  - DB_TYPE=mysql
                  - DB_HOST=$RDS_ENDPOINT:3306
                  - DB_NAME=giteadb
                  - DB_USER=gitea
                  - DB_PASSWD=gitea_passwd
                  - ROOT_URL=http://$ALB_DNS/
                volumes:
                  - /gitea:/data
                ports:
                  - "80:3000"
                restart: always" > /gitea/docker-compose.yml

            cd /gitea
            sudo docker-compose up -d

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: cmtr-iacp1ebx-asg
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref GiteaLaunchTemplate
        Version: !GetAtt GiteaLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      Tags:
        - Key: Name
          Value: cmtr-iacp1ebx-instance
          PropagateAtLaunch: true

  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${ALB.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}"
        TargetValue: 10

  # ---------- CloudWatch Dashboard ----------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: cmtr-iacp1ebx-dashboard
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "RDS CPUUtilization",
                    "metrics": [["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "giteadb"]],
                    "period": 300, "stat": "Average", "region": "eu-west-1"
                  }
                },
                {
                  "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "RDS DatabaseConnections",
                    "metrics": [["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "giteadb"]],
                    "period": 300, "stat": "Average", "region": "eu-west-1"
                  }
                },
                {
                  "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "ALB HealthyHostCount",
                    "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "LoadBalancer", "${ALBFullName}", "TargetGroup", "${TGFullName}"]],
                    "period": 300, "stat": "Average", "region": "eu-west-1"
                  }
                },
                {
                  "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "ALB RequestCount",
                    "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ALBFullName}"]],
                    "period": 300, "stat": "Sum", "region": "eu-west-1"
                  }
                },
                {
                  "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
                  "properties": {
                    "title": "EFS ClientConnections",
                    "metrics": [["AWS/EFS", "ClientConnections", "FileSystemId", "${EfsId}"]],
                    "period": 300, "stat": "Sum", "region": "eu-west-1"
                  }
                }
              ]
            }
          - ALBFullName: !GetAtt ALB.LoadBalancerFullName
            TGFullName: !GetAtt TargetGroup.TargetGroupFullName
            EfsId: !Ref EFS

Outputs:
  ALBDNSName:
    Description: DNS name of the load balancer
    Value: !GetAtt ALB.DNSName
  RDSEndpoint:
    Description: RDS endpoint
    Value: !GetAtt GiteaDB.Endpoint.Address
  EFSId:
    Description: EFS file system ID
    Value: !Ref EFS
