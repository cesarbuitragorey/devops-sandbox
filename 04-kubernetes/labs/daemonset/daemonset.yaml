# ============================================================
# DAEMONSET: Fluentd para recolección de logs por nodo
# ============================================================
# Este DaemonSet garantiza que exista EXACTAMENTE un Pod
# de Fluentd corriendo en CADA nodo del cluster.
# Ideal para:
# - logs
# - métricas
# - agentes de seguridad
# - CNI / CSI / observabilidad
# ============================================================

# ------------------------------------------------------------
# API estable para workloads
# ------------------------------------------------------------
apiVersion: apps/v1

# ------------------------------------------------------------
# Tipo de recurso
# DaemonSet = 1 Pod por nodo (no por replicas)
# ------------------------------------------------------------
kind: DaemonSet

metadata:
  # Nombre del DaemonSet
  name: fluentd-elasticsearch

  # Namespace del sistema
  # kube-system es el lugar correcto para agentes del cluster
  namespace: kube-system

  labels:
    # Etiqueta descriptiva del componente
    k8s-app: fluentd-logging

# ------------------------------------------------------------
# Especificación del DaemonSet
# ------------------------------------------------------------
spec:
  # Selector obligatorio
  # Debe coincidir EXACTAMENTE con las labels del template
  selector:
    matchLabels:
      app: fluentd-elasticsearch

  # ----------------------------------------------------------
  # Plantilla del Pod (como Deployment/StatefulSet)
  # ----------------------------------------------------------
  template:
    metadata:
      labels:
        app: fluentd-elasticsearch

    spec:
      # ------------------------------------------------------
      # Tolerations
      # Permiten que el DaemonSet corra también en nodos:
      # - control-plane
      # - master
      # Sin esto, fluentd NO correría allí
      # ------------------------------------------------------
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      # ------------------------------------------------------
      # Contenedores
      # ------------------------------------------------------
      containers:
        - name: fluentd

          # Imagen oficial y estable
          # Hospedada en quay.io
          image: quay.io/fluentd_elasticsearch/fluentd:v2.5.2

          # --------------------------------------------------
          # Recursos
          # IMPORTANTE: DaemonSets SIEMPRE deben limitar recursos
          # porque se replica por cada nodo
          # --------------------------------------------------
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 200Mi

          # --------------------------------------------------
          # Volume mounts
          # Fluentd necesita leer logs DEL NODO
          # --------------------------------------------------
          volumeMounts:
            # Logs del sistema
            - name: varlog
              mountPath: /var/log

            # Logs de los contenedores Docker
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

      # ------------------------------------------------------
      # Tiempo de gracia al terminar el Pod
      # Da tiempo a que fluentd envíe logs pendientes
      # ------------------------------------------------------
      terminationGracePeriodSeconds: 30

      # ------------------------------------------------------
      # Volúmenes del host
      # hostPath es típico en DaemonSet (agentes)
      # ------------------------------------------------------
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory