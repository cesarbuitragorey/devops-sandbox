apiVersion: v1              # Versión de la API de Kubernetes.
                             # Para Pods siempre es "v1".

kind: Pod                   # Tipo de recurso: un Pod (la unidad mínima en Kubernetes).

metadata:
  name: secret-test-pod     # Nombre del Pod dentro del namespace.

spec:                       # Especificación del Pod (qué va a ejecutar).
  containers:               # Lista de contenedores que corren dentro del Pod.
  - name: test-container    # Nombre del contenedor (interno al Pod).
    
    image: k8s.gcr.io/busybox
                             # Imagen Docker usada.
                             # busybox es una imagen ultra-ligera con utilidades básicas.
    
    command: [ "/bin/sh", "-c", "env" ]
                             # Comando que se ejecuta al iniciar el contenedor.
                             # /bin/sh -c "env" ejecuta el comando "env",
                             # que imprime todas las variables de entorno.

