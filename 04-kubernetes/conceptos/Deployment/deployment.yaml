# Definición de variables de entorno comunes
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_COLOR: "blue"
  LOG_LEVEL: "info"
---
# Definición de datos sensibles (codificados en base64)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  DB_PASSWORD: bXlwYXNzd29yZA== # "mypassword" en base64
