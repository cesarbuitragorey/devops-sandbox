apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-view
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cesarbuitragorey/devops-sandbox.git
    targetRevision: main
    path: demo-k8s/app

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-k8s

  syncPolicy: {}