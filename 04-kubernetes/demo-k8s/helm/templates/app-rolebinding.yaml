apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-app-binding
  namespace: {{ .Values.namespace }}
subjects:
- kind: ServiceAccount
  name: demo-app-sa
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: demo-app-reader
  apiGroup: rbac.authorization.k8s.io
