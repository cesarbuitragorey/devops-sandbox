apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-deployer
  namespace: {{ .Values.namespace }}
rules:
- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - get
    - list
    - create
    - update
    - patch
- apiGroups: [""]
  resources:
    - services
  verbs:
    - get
    - create
    - update
