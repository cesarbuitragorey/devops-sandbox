apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-k8s
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: web
          image: nginx:stable
          ports:
            - containerPort: 80

          # 1️⃣ ConfigMap como variable de entorno
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: APP_MESSAGE

          # 2️⃣ Secret como variable de entorno
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          # 3️⃣ ConfigMap y Secret como archivos
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true           
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: demo-app-config
        - name: secret-volume
          secret:
            secretName: demo-app-secret