apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-k8s
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: web
          image: nginx:stable
          ports:
            - containerPort: 80

          # 1️⃣ ConfigMap como variable de entorno
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: APP_MESSAGE

          # ✅ Recursos VAN AQUÍ (en el contenedor)
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          # 2️⃣ ConfigMap como archivo
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: demo-app-config