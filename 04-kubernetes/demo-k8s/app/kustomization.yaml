apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-k8s

resources:
  - namespace.yaml

  # Configuración
  - config/configmap.yaml
  - config/secret.yaml

  # App principal (SIN CAMBIOS)
  - base-app/deployment.yaml
  - base-app/service.yaml
  - base-app/hpa.yaml

  # Storage demos
  - storage/emptydir-pod.yaml
  - storage/hostpath-pod.yaml
  - storage/pv.yaml
  - storage/pvc.yaml
  - storage/pvc-pod.yaml