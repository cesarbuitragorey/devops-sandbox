apiVersion: v1
kind: Pod
metadata:
  name: i-know-who-i-am
  namespace: default
  labels:
    app: i-know-who-i-am
spec:
  containers:
  - name: main
    image: busybox:1.34
    command:
      - sh
      - -c
    args:
      - env && sleep infinity
    env:
      - name: MY_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: MY_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: MY_POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: MY_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: MY_POD_SERVICE_ACCOUNT
        valueFrom:
          fieldRef:
            fieldPath: spec.serviceAccountName
    tty: true
    stdin: true
  restartPolicy: Always
