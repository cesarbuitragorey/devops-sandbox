apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-deleter-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-pod-deleter
  namespace: clean-up
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-pod-deleter-binding
  namespace: clean-up
subjects:
- kind: ServiceAccount
  name: cleanup-deleter-sa
  namespace: default
roleRef:
  kind: Role
  name: cleanup-pod-deleter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: delete-cleanup-pods
  namespace: default
spec:
  backoffLimit: 1
  template:
    metadata:
      name: delete-cleanup-pods
    spec:
      serviceAccountName: cleanup-deleter-sa
      restartPolicy: Never
      containers:
      - name: cleanup
        image: bitnami/kubectl:1.27.0
        command:
        - kubectl
        - delete
        - pods
        - --all
        - --namespace
        - clean-up
