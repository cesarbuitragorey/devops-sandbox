apiVersion: apps/v1
kind: Deployment
metadata:
  name: cesarbuitrago-app
  labels:
    task: deploy
    app: cesarbuitrago-app
    student: cesarbuitrago
spec:
  replicas: 1
  selector:
    matchLabels:
      deploy: cesarbuitrago-app
  template:
    metadata:
      labels:
        deploy: cesarbuitrago-app
        kind: redis
        role: master
        tier: db
    spec:
      initContainers:
      - name: init-sleep
        image: busybox:1.34
        command: ["sleep", "10"]
      containers:
      - name: redis-master
        image: redis:5-alpine
        ports:
        - containerPort: 6379