---
- name: Check the requested role behavior
  ansible.builtin.assert:
    that:
      - collectd_state in ['install', 'remove']
    fail_msg: "collectd_state must be 'install' or 'remove', got '{{ collectd_state }}'"

- name: Install the collectd packages
  ansible.builtin.include_tasks: install_packages.yml
  when: collectd_state == 'install'

- name: Configure and start collectd
  ansible.builtin.include_tasks: install_collectd.yml
  when: collectd_state == 'install'

- name: Remove collectd
  ansible.builtin.include_tasks: remove_collectd.yml
  when: collectd_state == 'remove'
